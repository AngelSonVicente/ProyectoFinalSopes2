spring.application.name=redxela
server.port=8080

# Un segundo real = 60 segundos simulados (1 minuto). Permite ver los SLA de 10-120 min en la demo.
redxela.reloj.factor=60
# Milisegundos reales de trabajo por cada unidad de un pedido (la cantidad de unidades es la carga de trabajo).
redxela.trabajo.ms-por-unidad=250
# Tiempo medio entre llegadas del generador automatico (ms reales).
redxela.generador.intervalo-ms=1500
# Si es true, el generador arranca solo al iniciar la aplicacion.
redxela.generador.auto-iniciar=false

# Tiempo que tarda Recepcion en escanear un camion (usa el escaner compartido).
redxela.recepcion.ms-escaneo=200
# Tiempo que tarda Inventario en procesar cada aviso (mas lento que Recepcion a proposito).
redxela.inventario.ms-procesamiento=700
# Capacidad del buzon acotado Recepcion -> Inventario.
redxela.inventario.capacidad-buzon=5
# Tiempo medio entre camiones automaticos (ms reales); arrancan junto con el generador de pedidos.
redxela.camiones.intervalo-ms=4000

# Tiempo que cada operacion del escenario de conflicto retiene un recurso antes de pedir el siguiente (ms reales).
redxela.conflicto.ms-por-paso=1500
